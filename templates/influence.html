<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ảnh Hưởng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#222;color:#eee}table{background:#2b2b2b}th{background:#3a3a3a}</style>
</head>
<body>
<div class="container py-4">
<h3 class="text-center mb-4">⭐ Bảng Xếp Hạng Tầm Ảnh Hưởng</h3>
<table class="table table-striped">
<thead><tr><th>Hạng</th><th>Mã</th><th>Tên</th><th>Degree</th><th>Betweenness</th><th>Closeness</th><th>Eigenvector</th><th>PageRank</th><th>Tổng</th></tr></thead>
<tbody>
{% for n in top %}
<tr {% if loop.first %}class="table-warning"{% endif %}>
<td>{{ loop.index }}</td><td>{{ n.ma }}</td><td>{{ n.ten }}</td><td>{{ n.degree }}</td><td>{{ n.betweenness }}</td><td>{{ n.closeness }}</td><td>{{ n.eigenvector }}</td><td>{{ n.pagerank }}</td><td><strong>{{ n.tong }}</strong></td>
</tr>
{% endfor %}
</tbody>
</table>
<a href="/" class="btn btn-secondary">← Trang Chủ</a>
</div>
</body>
</html>
